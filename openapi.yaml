      scheme: bearer
      bearerFormat: ctr_<prefix>_<secret>
      description: "Clé créée par un administrateur (Paramètres → API). Scopes : contracts:read, contracts:dates:read, pricing:read, pricing:quote, webhooks:manage, proposals:read, proposals:pricing:read."
