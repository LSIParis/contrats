info:
  title: LSI-Maintenance — API Contrats
  version: 1.0.0
  description: "API de lecture des contrats clients pour les applications de la suite LSI-Maintenance. Authentification par clé d’API (`Authorization: Bearer ctr_…`), scopes fins, débit limité par client. Pagination par curseur (`nextCursor`), `ETag` / `If-None-Match`, erreurs RFC 9457. Guide : docs/contrats/07-api.md."
servers:
  - url: https://contrats.lsi-maintenance.fr
tags:
  - name: Contrats
  - name: Tarification
  - name: Échéances
  - name: Propositions
  - name: Webhooks
components:
