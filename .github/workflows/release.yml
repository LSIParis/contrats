# Publication et déploiement — application « Contrats »
# push sur main   -> image ghcr.io:main + sha-xxxxxxx -> redéploiement préproduction
# tag vX.Y.Z      -> image ghcr.io:X.Y.Z + X.Y        -> redéploiement production (après approbation)
# Le déploiement passe par un tunnel SSH vers le VPS (voir deploy.yml).
name: Release

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: Construction et publication sur ghcr.io
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: ci
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    outputs:
      image: ${{ steps.name.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # GHCR exige un nom d'image en minuscules.
      - name: Nom de l'image
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Connexion à ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags et labels OCI
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.name.outputs.image }}
          flavor: |
            latest=false
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=contrats
            org.opencontainers.image.description=Gestion du cycle de vie des contrats clients
            org.opencontainers.image.vendor=LSI-Maintenance

      - name: Construction et publication
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Attestation de provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.name.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # Action épinglée par SHA : les tags de trivy-action ont été compromis en mars 2026.
      - name: Scan de l'image publiée (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ steps.name.outputs.image }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Envoi du rapport vers GitHub Code Scanning
        if: always() && hashFiles('trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy.sarif
          category: trivy-image

  deploy-staging:
    name: Préproduction
    if: github.ref == 'refs/heads/main'
    needs: publish
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      tag: main
    secrets: inherit

  previous-version:
    name: Version précédente (retour arrière)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.previous.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Recherche du tag précédent
        id: previous
        env:
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          prev=$(git tag --list 'v*.*.*' --sort=-v:refname | grep -vx "v${VERSION}" | head -n 1 || true)
          echo "tag=${prev#v}" >> "$GITHUB_OUTPUT"
          echo "Version précédente : ${prev:-aucune}"

  # Approbation manuelle : configurer des « required reviewers » sur l'environnement production.
  deploy-production:
    name: Production
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [publish, previous-version]
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      tag: ${{ needs.publish.outputs.version }}
      expected-version: ${{ needs.publish.outputs.version }}
      rollback-tag: ${{ needs.previous-version.outputs.tag }}
    secrets: inherit
